    <script>
      (function () {
        var t = "light";
        try {
          t =
            localStorage.getItem("theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
        } catch (e) {}
        document.documentElement.classList.toggle("dark", t === "dark");
      })();
    </script>
